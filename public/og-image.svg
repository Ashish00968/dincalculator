<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#090A0C"/>
  <circle cx="950" cy="160" r="380" fill="#FF6B00" opacity="0.12" filter="blur(90px)"/>
  <circle cx="200" cy="500" r="280" fill="#FF8533" opacity="0.08" filter="blur(80px)"/>
  
  <!-- Subtle Technical Grid pattern -->
  <g opacity="0.06" stroke="#F4F4F5" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Precision Mountain & Release Emblem -->
  <g transform="translate(100, 130)">
    <rect width="80" height="80" rx="22" fill="#18181B" stroke="#FF6B00" stroke-width="2.5"/>
    <path d="M20 58L34 28L44 46L56 20L68 58H20Z" fill="url(#logoGrad)" stroke="#FF6B00" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="56" cy="20" r="4" fill="#FF8533"/>
  </g>

  <!-- Brand Typography -->
  <text x="205" y="172" fill="#FF6B00" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="4">ISO 11088:2018 RELEASE ENGINE</text>
  <text x="205" y="196" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="1">DETERMINISTIC PRECISION MATH</text>
  
  <text x="100" y="295" fill="#FAFAFA" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">DIN Calculator <tspan fill="#FF6B00">Pro</tspan></text>
  <text x="100" y="350" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">High-Precision Ski Binding Release Settings &amp; Interactive ISO Matrix</text>

  <!-- Metric Badges -->
  <g transform="translate(100, 420)">
    <rect width="280" height="74" rx="18" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <text x="25" y="32" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ISO 11088 STANDARD</text>
    <text x="25" y="56" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">100% Certified Logic</text>
  </g>
  <g transform="translate(410, 420)">
    <rect width="280" height="74" rx="18" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <text x="25" y="32" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">PRIVACY ARCHITECTURE</text>
    <text x="25" y="56" fill="#FF8533" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Zero Tracking / Cookies</text>
  </g>
  <g transform="translate(720, 420)">
    <rect width="280" height="74" rx="18" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <text x="25" y="32" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXECUTION ENGINE</text>
    <text x="25" y="56" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">&lt; 1ms In-Browser</text>
  </g>

  <!-- Footer link -->
  <text x="100" y="565" fill="#71717A" font-family="ui-monospace, monospace" font-size="17" font-weight="600">dincalculatorpro.com</text>

  <defs>
    <linearGradient id="logoGrad" x1="20" y1="20" x2="68" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF6B00" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FF4500" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
