name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Test & SEO Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & golden tests
        run: npm run test

      - name: Build static production site
        run: npm run build

      - name: Verify SEO compliance (titles, metas, H1s, canonicals)
        run: npm run check:seo

      - name: Verify internal link integrity (no broken links)
        run: npm run check:links
